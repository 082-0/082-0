name: Refresh contribution snake
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]
permissions:
  contents: write
concurrency:
  group: contribution-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate night-ink snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ddd3ea&color_dots=#0d0817,#2c2140,#4a3a6a,#7b5cc4,#b3a0d8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated SVG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          git init --initial-branch=output
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-snake.svg
          git commit -m 'Refresh contribution snake'
          git remote add origin "https://github.com/${GH_REPO}.git"
          credential=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${credential}" push --force origin HEAD:output
