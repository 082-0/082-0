<svg xmlns="http://www.w3.org/2000/svg" width="460" height="192" viewBox="0 0 460 192" role="img" aria-labelledby="title desc">
  <title id="title">OMP Presence</title>
  <desc id="desc">Show OMP activity on Discord. Windows v7 download available.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050508"/><stop offset="1" stop-color="#11091f"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#7c3aed" stop-opacity=".45"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x=".5" y=".5" width="459" height="191" rx="18" fill="url(#bg)" stroke="#392652"/>
  <circle cx="400" cy="5" r="160" fill="url(#glow)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="24" y="23" width="40" height="40" rx="11" fill="#281943" stroke="#63408d"/>
    <text x="44" y="49" text-anchor="middle" fill="#d9c6ff" font-size="13" font-weight="700">OMP</text>
    <text x="78" y="39" fill="#aa90c8" font-size="9" letter-spacing="1.6">DESKTOP / DISCORD</text>
    <text x="78" y="59" fill="#f2eaff" font-size="19" font-weight="650">OMP Presence</text>
    <text x="24" y="100" fill="#bfb0d1" font-size="13">Your OMP project and model on Discord.</text>
    <text x="24" y="121" fill="#bfb0d1" font-size="13">Windows v7 · macOS and Linux planned</text>
    <path d="M24 144 H436" stroke="#362247"/>
    <text x="24" y="170" fill="#bca1e5" font-size="10" letter-spacing="1.5">VIEW PROJECT</text>
    <text x="433" y="172" text-anchor="end" fill="#c4a4ff" font-size="20">↗</text>
  </g>
</svg>
